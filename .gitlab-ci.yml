# See: https://mastodon.scot/@dburke@mastodon.social/112756867937534489

image: fpco/stack-build:lts-22

# https://docs.gitlab.com/ee/ci/yaml/#stages
# jobs of the same stage are executed in parallel
stages:
  - build
  - test
  - compile-examples

# https://docs.gitlab.com/ee/ci/variables/#using-the-ci-variables-in-your-job-scripts
variables:
    STACK_ROOT: "${CI_PROJECT_DIR}/.stack-root"

build:
  # https://docs.gitlab.com/ee/ci/yaml/#cache
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .stack-work/
      - .stack-root/
  script:
    - stack --no-terminal build gitlab-haskell --fast

test:
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .stack-work/
      - .stack-root/
  needs: ["build"]
  script:
    - stack --no-terminal test gitlab-haskell --fast

compile-examples:
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .stack-work/
      - .stack-root/
  needs: ["build"]
  script:
    - stack --no-terminal build examples --fast

